<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Asientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-container">
  <div class="login-card">
    <h2>Mapa de Asientos</h2>
    <p>Acceso para vendedor</p>

    <label>Email</label>
    <input id="loginEmail" type="email">

    <label>Contraseña</label>
    <input id="loginPassword" type="password">

    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="layout hidden">

  <header>
    <h1>Mapa de Asientos</h1>
    <span>Avión 3–3 · 189 puestos</span>
    <button class="logout" onclick="logout()">Salir</button>
  </header>

  <!-- MAPA -->
  <section class="seats">
    <div id="avion" class="grid"></div>
  </section>

  <!-- PANEL -->
  <section class="panel">
    <h2>Asiento <span id="seatLabel">—</span></h2>

    <label>Nombre del pasajero</label>
    <input id="nombre">

    <label>Documento / Pasaporte</label>
    <input id="documento">

    <!-- ✅ NUEVO CAMPO -->
    <label>Empresa</label>
    <input id="empresa">

    <label>Teléfono</label>
    <input id="telefono">

    <label>Email</label>
    <input id="email">

    <hr>

    <label>Vendedor</label>
    <input id="vendedor">

    <label>Precio</label>
    <input id="precio" type="number">

    <label>Estado</label>
    <select id="estado">
      <option value="libre">LIBRE</option>
      <option value="pendiente">PENDIENTE</option>
      <option value="abono">ABONO</option>
      <option value="pagado">PAGADO</option>
    </select>

    <label>Observaciones</label>
    <input id="observaciones">

    <div class="actions">
      <button class="primary" onclick="guardar()">Guardar</button>
      <button class="danger" onclick="liberar()">Liberar</button>
    </div>

    <button class="export" onclick="exportarCSV()">Exportar CSV</button>
  </section>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
