<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Asientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>

<!-- LOGIN -->
<section id="loginScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Mapa de Asientos</h1>
    <p>Acceso para vendedor</p>

    <label>Email</label>
    <input id="loginEmail" />

    <label>Contraseña</label>
    <input id="loginPass" type="password" />

    <button id="btnLogin" class="btn primary">Entrar</button>
  </div>
</section>

<!-- APP -->
<div id="app" class="layout" style="display:none;">
  <section class="seats">
    <header class="topbar">
      <div>
        <h2>Mapa de Asientos</h2>
        <span>Avión 3–3 · 189 puestos</span>
      </div>
      <button id="btnLogout" class="btn danger">Salir</button>
    </header>

    <div id="avion" class="grid"></div>
  </section>

  <section class="panel">
    <h3>Asiento <span id="seatLabel">—</span></h3>

    <label>Nombre del pasajero</label>
    <input id="nombre">

    <label>Documento / Pasaporte</label>
    <input id="documento">

    <!-- NUEVO -->
    <label>Empresa</label>
    <input id="empresa">

    <label>Teléfono</label>
    <input id="telefono">

    <label>Email</label>
    <input id="email">

    <hr>

    <label>Vendedor</label>
    <input id="vendedor">

    <label>Precio</label>
    <input id="precio" type="number">

    <label>Estado</label>
    <select id="estadoPago">
      <option value="libre">LIBRE</option>
      <option value="pendiente">PENDIENTE</option>
      <option value="abono">ABONO</option>
      <option value="pagado">PAGADO</option>
    </select>

    <label>Observaciones</label>
    <input id="observaciones">

    <div class="actions">
      <button id="btnGuardar" class="btn primary">Guardar</button>
      <button id="btnLiberar" class="btn danger">Liberar</button>
    </div>

    <button id="btnCSV" class="btn export">Exportar CSV</button>
  </section>
</div>

<script src="script.js?v=12"></script>
</body>
</html>
