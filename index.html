<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Asientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="./styles.css?v=8" />
</head>
<body>

<!-- LOGIN FULLSCREEN -->
<section id="loginScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-title">Mapa de Asientos</div>
    <div class="auth-subtitle">Acceso para vendedor</div>

    <label class="auth-label">Email</label>
    <input id="loginEmail" class="auth-input" autocomplete="username" />

    <label class="auth-label">Contraseña</label>
    <input id="loginPass" class="auth-input" type="password" autocomplete="current-password" />

    <button id="btnLogin" class="btn primary full">Entrar</button>
    <div id="authError" class="auth-error" style="display:none;"></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="layout" style="display:none;">

  <section class="seats">
    <header class="topbar">
      <div class="brand">
        <div class="title">Mapa de Asientos</div>
        <div class="subtitle">Avión 3–3 · 189 puestos</div>
      </div>

      <div class="top-actions">
        <button id="btnLogout" class="btn danger">Salir</button>
      </div>
    </header>

    <div id="avion" class="grid"></div>
  </section>

  <section class="panel">
    <h2>Asiento <span id="seatLabel">—</span></h2>

    <label>Nombre del pasajero</label>
    <input id="nombre">

    <label>Documento</label>
    <input id="documento">

    <label>Teléfono</label>
    <input id="telefono">

    <label>Email</label>
    <input id="email">

    <hr>

    <label>Vendedor</label>
    <input id="vendedor">

    <label>Precio</label>
    <input id="precio" type="number">

    <label>Moneda</label>
    <select id="moneda">
      <option>USD</option>
      <option>PAB</option>
      <option>EUR</option>
    </select>

    <label>Forma de pago</label>
    <select id="formaPago">
      <option>TC</option>
      <option>Transferencia</option>
      <option>Efectivo</option>
      <option>Mixto</option>
    </select>

    <label>Estado de pago</label>
    <select id="estadoPago">
      <option value="libre">LIBRE</option>
      <option value="pendiente">PENDIENTE</option>
      <option value="abono">ABONO</option>
      <option value="pagado">PAGADO</option>
    </select>

    <label>Fecha de pago</label>
    <input id="fechaPago">

    <label>Observaciones</label>
    <input id="observaciones">

    <div class="actions">
      <button id="btnGuardar" class="btn primary">Guardar</button>
      <button id="btnLiberar" class="btn danger">Liberar</button>
    </div>

    <button id="btnCSV" class="btn export">Exportar CSV</button>
  </section>
</div>

<script src="./script.js?v=8"></script>
</body>
</html>
